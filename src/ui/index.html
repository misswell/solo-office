<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solo Office</title>
    <style>
      :root {
        /* 壳是浅色：WPS 的默认界面就是白底功能区 + 浅灰窗框，深色壳是我们自己的旧想法，和 WPS 摆在一起就不是一个东西。
           这一套只换壳与浮层，纸面、格线、状态栏本来就是浅色，不动。 */
        --chrome: #f3f4f6;
        --chrome-2: #fafbfc;
        --chrome-line: #e3e6ea;
        --ink: #1f2328;
        --ink-dim: #6b7280;
        --accent: #2b7de9;
        --accent-soft: #2b7de91f;
        --paper: #f4f5f7;
        --sheet-head: #f0f1f3;
        --grid-line: #dcdfe4;
        --font-ui: -apple-system, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
        --font-doc: "Times New Roman", "Songti SC", Georgia, serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font-ui);
        background: var(--chrome);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- top bar ---- */
      /* `body >` 不是多余：模块自己注入的浮层（对话框、审阅窗格）里也有 `<header>`，
         裸元素选择器会把这条深色顶栏画到别人卡片上。这条规则说的是窗口顶上那一格。 */
      body > header {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 46px;
        padding: 0 14px 0 82px;
        background: linear-gradient(180deg, #ffffff, #f6f7f9);
        border-bottom: 1px solid #e1e4e8;
        flex: none;
        -webkit-app-region: drag;
      }
      header button, header .doc-tab, header #open-btn { -webkit-app-region: no-drag; }
      /* 快速访问那一排：`wpsongmani.kui:212` 声明的 `QAT` 默认命令序是
         AutoSaveFile → SaveFile → PrintToPDF → Print… → Undo → Redo（`:337` 的
         `KRbQuicktoolCommand` 把它挂进窗口顶栏，紧挨页签条）。家里没有自动保存与那几条打印，
         留下的就是 打开 / 保存 / 导出 PDF / 撤销 / 重做——顺序照上面那串。 */
      .qat { display: flex; align-items: center; gap: 2px; }
      .qat .tool {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        font: inherit;
        color: #3f4750;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }
      .qat .tool:hover { background: #e8eef7; }
      .qat .tool:disabled { opacity: .35; cursor: default; }
      .qat .tool svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .qat-sep { width: 1px; height: 16px; background: #d9dee5; margin: 0 3px; }
      /* 文件名居中：WPS 把文档名摆在窗口正中。绝对定位不随左边那排按钮的宽窄漂移，
         两侧各留出快速访问与窗口钮的地界，长了省略。 */
      .title-slot {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(46%, 520px);
        text-align: center;
        font-size: 13px;
        color: var(--ink-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }

      /* ---- formula / address bar ---- */
      .bar {
        display: none;
        align-items: center;
        gap: 0;
        height: 34px;
        background: var(--chrome-2);
        border-bottom: 1px solid #e1e4e8;
        flex: none;
      }
      .bar.on { display: flex; }
      .addr {
        width: 92px;
        flex: none;
        text-align: center;
        font-size: 12px;
        color: var(--ink-dim);
        border-right: 1px solid var(--chrome-line);
        line-height: 34px;
      }
      .fx {
        width: 42px;
        flex: none;
        text-align: center;
        font-style: italic;
        font-family: Georgia, serif;
        font-size: 14px;
        color: var(--ink-dim);
        border-right: 1px solid var(--chrome-line);
      }
      #input {
        flex: 1;
        height: 100%;
        border: 0;
        outline: 0;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        padding: 0 12px;
      }

      /* ---- ribbon (spreadsheet formatting) ---- */
      .ribbon {
        display: none;
        align-items: center;
        height: 38px;
        padding: 0 4px;
        background: #fff;
        border-bottom: 1px solid #e1e4e8;
        flex: none;
        overflow-x: auto;
      }
      .ribbon.on { display: flex; }
      .grp { display: flex; align-items: center; gap: 3px; padding: 0 9px; border-right: 1px solid var(--chrome-line); }
      .grp:last-child { border-right: 0; }
      /* 文字那一页把命令分在几档上（WPS 自己声明的 tab 条：`office6/res/wpsongmani.kui:114-122` 里
         `CT_Home → CT_Insert → CT_PageLayout → CT_References → CT_Review → CT_View`）。一条行装不下 11 组——
         装机件量到内容 2,664 px 对可视 1,280 px，「页面设置」往后的那几枚点不到。所以：上档名、下一行只放当前档的组。
         表与演示那两页不分行，仍是原来那一条 38 px。 */
      .ribbon.tabbed { flex-direction: column; align-items: stretch; height: auto; overflow: hidden; }
      .rtabs {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        padding: 2px 4px 0;
        background: #f3f4f6;
        border-bottom: 1px solid #e1e4e8;
        flex: none;
      }
      .rtabs button {
        font: inherit;
        font-size: 12px;
        color: #5b636d;
        background: none;
        border: 1px solid transparent;
        border-bottom: 0;
        border-radius: 5px 5px 0 0;
        padding: 1px 10px 2px;
        cursor: pointer;
      }
      .rtabs button:hover { color: var(--ink); }
      .rtabs button.on { color: var(--accent); background: #fff; border-color: #e1e4e8; font-weight: 600; }
      .rbar { display: flex; align-items: center; height: 38px; padding: 0 4px; overflow-x: auto; flex: none; background: #fff; }
      .rbar[hidden] { display: none; }
      /* 装不下的那一档给一枚看得见的箭头，否则用户看到的是一枚被切一半的按钮，说不出「右边还有、能滚」。
         WPS 那边「单行放不下」确有声明：`res/commands/wps/ongmani/` 里 515 个 `<K*ListCommand>` 组声明有 30 个带
         `needsinglerowmorebutton="true"`（`CT_Home.kuip:105` RB_Font、`:367` RB_Paragraph、`CT_PageLayout.kuip:152`
         RB_Page_Setup、`CT_Insert.kuip:157` RB_Illustrations）——但它声明在**组**上，这一枚挂在**整行**右端，
         形状不同，是已知差别。`res/wpsongmani.kui:113` 那条 tab 条上另有 `idKey="CommonLogicGroupShowArrow"`：
         名字带 ShowArrow，指的是档名条还是组行**未取证**，只记名不当同物引用。
         箭头站在 `.rbar` 外面那一端，所以给行留一道右垫：滚到头的最后一枚不会被它压住。 */
      .ribbon.tabbed { position: relative; }
      .ribbon.tabbed .rbar { padding-right: 34px; }
      /* 组名贴在组的脚下（WPS 功能区每组下面那行小字）。`.grp` 本是单行 flex，这里允许换行，
         组名用 `flex-basis:100%` 独占末行；组名措辞是我们自己的，归属按 WPS 的组声明。 */
      .ribbon.tabbed .rbar { align-items: stretch; height: auto; min-height: 64px; padding-top: 2px; }
      .ribbon.tabbed .grp { flex: none; flex-wrap: wrap; align-content: center; justify-content: center; padding: 4px 9px 2px; }
      .ribbon.tabbed .grp::after {
        content: attr(data-cap);
        flex-basis: 100%;
        order: 999;
        margin-top: 2px;
        text-align: center;
        font-size: 10px;
        line-height: 12px;
        color: #7c8592;
        white-space: nowrap;
      }
      .ribbon.tabbed .grp:not([data-cap])::after { display: none; }
      .rover {
        position: absolute;
        right: 7px;
        bottom: 6px;
        z-index: 2;
        width: 22px;
        height: 26px;
        padding: 0;
        border: 1px solid #d5dae1;
        border-radius: 3px;
        background: #fff;
        color: #5b636d;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      .rover:hover { background: #eef3fa; }
      .rover[hidden] { display: none; }
      /* `RB_Page_Setup` 那四枚页边距自旋格：WPS 给每枚声明 `fixedSpinBoxWidth="84"`（`CT_PageLayout.kuip:156-159`），
         所以一格连名带框占 84 px、框吃掉剩下的宽度；高度压在行里，不为一格把带子撑高。 */
      .ribbon .rspin { display: inline-flex; align-items: center; gap: 3px; width: 84px; font-size: 12px; }
      .ribbon .rspin input {
        flex: 1;
        min-width: 0;
        height: 22px;
        padding: 0 3px;
        font: inherit;
        text-align: right;
      }
      button.rb {
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 5px;
        padding: 3px 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      button.rb:hover { background: #eaf2fd; border-color: #d6e4fb; }
      button.rb:disabled { opacity: .35; cursor: default; }
      button.rb.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      /* WPS 那一档的命令钮是「图标在上、字在下」。图标是自家画的 24×24 细线 SVG（WPS 那边是彩色位图，
         形状不同是已知差别，图形资源一份也没搬）；图标 span 里没有文字节点，按钮的 textContent 仍是那行字。
         高度 2 + 20 + gap 1 + 行 12 + 1 = 36，压得住「命令行 + 组名行」那 64 px。 */
      .ribbon.tabbed button.rb.ico {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        min-width: 38px;
        padding: 2px 5px 1px;
        line-height: 1;
      }
      .ribbon.tabbed button.rb.ico .ic { display: block; width: 20px; height: 20px; color: #3f4750; }
      .ribbon.tabbed button.rb.ico .ic svg {
        display: block;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ribbon.tabbed button.rb.ico .lb { font-size: 11px; line-height: 12px; white-space: nowrap; }
      .ribbon.tabbed button.rb.ico.on .ic { color: #fff; }
      /* 字体框与字号框在 WPS 里同挂 `RB_Font` 的 `font_info_pair`（`KxWpsFontComboBoxCommand idMso="Font"` 写
         `minimumWidth="130"`、`layoutOnLeft="true"`，字号紧跟其后），所以这一对必须是同一只盒子：高度在这里写死，
         不靠 `<select>` 的 UA 默认值——`<input>` 自己量出来是 20，两格并排就错开 1px 顶边。宽度才各自说。 */
      select.pick,
      input.facebox,
      input.sizebox {
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        background: #fff;
        border: 1px solid #c9ced6;
        border-radius: 5px;
        padding: 2px 4px;
        height: 22px;
      }
      input.facebox { width: 130px; }
      /* 字号那一格是 WPS 的 ComboBox：`CT_TableTools.kuip` 声明 `fixedWidth="60"`，与同一对里的字体框同高同顶。 */
      input.sizebox { width: 60px; }
      input.swatch { width: 24px; height: 22px; padding: 0; border: 1px solid #c9ced6; border-radius: 5px; background: #fff; }

      /* ---- main split ---- */
      main { flex: 1; display: flex; min-height: 0; background: var(--paper); }
      #view { flex: 1; overflow: auto; position: relative; }

      /* ---- empty state ---- */
      .empty {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #6b7280;
        background: #eef0f3;
      }
      .empty h1 { font-size: 26px; font-weight: 600; color: #2c3138; margin: 0; letter-spacing: -.01em; }
      .empty p { margin: 0; font-size: 13.5px; }
      .drop {
        border: 1.5px dashed #c3c9d2;
        border-radius: 14px;
        padding: 42px 60px;
        text-align: center;
        background: #fff;
        transition: border-color .15s, box-shadow .15s;
      }
      .drop.hot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
      .drop kbd {
        font: inherit;
        font-size: 11px;
        background: #eef1f5;
        border: 1px solid #d8dde4;
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
      }
      .fmts { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
      .fmt { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 5px; color: #fff; }
      .fmt.x { background: #1d7a4f; } .fmt.w { background: #2b62a8; } .fmt.p { background: #b4531f; }
      button.fmt { border: 0; cursor: pointer; font-family: inherit; }
      button.fmt:hover { filter: brightness(1.15); }

      /* ---- spreadsheet ---- */
      .sheet-wrap { position: relative; outline: none; user-select: none; }
      table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; color: #1f2328; }
      table.grid th {
        position: sticky;
        background: var(--sheet-head);
        border: 1px solid var(--grid-line);
        border-width: 0 1px 1px 0;
        font-weight: 500;
        font-size: 11.5px;
        color: #5b636d;
        height: 22px;
      }
      table.grid th.corner { top: 0; left: 0; width: 46px; min-width: 46px; z-index: 8; }
      table.grid th.colh { top: 0; z-index: 5; }
      table.grid th.rowh { left: 0; width: 46px; min-width: 46px; z-index: 4; }
      table.grid th.fz { z-index: 7; }
      table.grid th.on-col, table.grid th.on-row { background: #cfd9e6; color: #1f2328; }
      table.grid td {
        border: 1px solid var(--grid-line);
        border-width: 0 1px 1px 0;
        padding: 0 5px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        background: #fff;
        z-index: 1;
      }
      table.grid td.fz { position: sticky; z-index: 3; }
      table.grid td.wrap { white-space: normal; }
      table.grid td.num { text-align: right; }
      table.grid td.err { color: #c0392b; }
      table.grid td.fx { background: #fbfcfe; }
      table.grid td.sel { background: #e8f1fb; }
      table.grid td.sel.fx { background: #e3eefa; }
      .sel-frame { position: absolute; border: 2px solid var(--accent); pointer-events: none; z-index: 3; display: none; }
      .cell-editor {
        position: absolute;
        z-index: 9;
        min-height: 21px;
        line-height: 20px;
        padding: 0 4px;
        background: #fff;
        border: 2px solid var(--accent);
        box-shadow: 0 3px 12px #0003;
        outline: none;
        white-space: pre;
        user-select: text;
        color: #1f2328;
        font-family: var(--font-ui);
      }

      .sheetbar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 2px;
        height: 30px;
        padding: 0 8px;
        background: #e6e9ed;
        border-top: 1px solid #cfd4da;
      }
      .sheetbar button {
        font: inherit;
        font-size: 12px;
        border: 0;
        background: transparent;
        color: #5b636d;
        padding: 4px 12px;
        border-radius: 6px 6px 0 0;
        cursor: pointer;
      }
      .sheetbar button.on { background: #fff; color: #1f2328; font-weight: 600; }
      .sheetbar button.add { font-weight: 700; padding: 4px 9px; color: #2f6fb0; }
      .sheetbar input.rename { font: inherit; font-size: 12px; width: 92px; border: 1px solid var(--accent); border-radius: 4px; padding: 2px 4px; }
      .status { margin-left: auto; font-size: 11.5px; color: #6b7280; padding-right: 6px; }

      .menu {
        position: fixed;
        z-index: 40;
        min-width: 152px;
        padding: 4px;
        background: #fff;
        border: 1px solid #d5dae1;
        border-radius: 8px;
        box-shadow: 0 10px 30px #0002;
        display: flex;
        flex-direction: column;
      }
      .menu button {
        font: inherit;
        font-size: 12.5px;
        text-align: left;
        color: var(--ink);
        background: transparent;
        border: 0;
        border-radius: 5px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .menu button:hover { background: #eaf2fd; color: var(--ink); }
      .menu .sep { height: 1px; background: #e6e9ee; margin: 3px 6px; }

      .find {
        position: absolute;
        top: 8px;
        right: 18px;
        z-index: 20;
        display: flex;
        align-items: flex-end;
        gap: 6px;
        padding: 7px 9px;
        background: #fff;
        border: 1px solid #c3c9d2;
        border-radius: 9px;
        box-shadow: 0 8px 26px #0003;
      }
      .find label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: #5b636d; }
      .find input { font: inherit; font-size: 12.5px; padding: 3px 6px; border: 1px solid #c3c9d2; border-radius: 5px; min-width: 108px; }
      .find button {
        font: inherit;
        font-size: 12px;
        padding: 4px 8px;
        border: 1px solid #c3c9d2;
        border-radius: 5px;
        background: #f2f4f7;
        color: #26292e;
        cursor: pointer;
      }
      .find button:hover { background: #e2e9f3; }

      /* ---- 标尺（视图·显示组的 ViewRulerWord，#228）----
         与纸同宽、同一个 `zoom`，宽度与缩放由 `doc-ruler.ts` 写在元素上；这里只管长相。它挂在纸盒前面，
         `position: sticky` 让它滚动时贴在滚动容器上沿（Word/WPS 的标尺也是这样）。`--pad-l` 以左、右沿
         以右是页边距，留在底色里；正文栏那一块由 `.ruler-area` 提亮。 */
      .doc-ruler {
        position: sticky;
        top: 0;
        z-index: 6;
        height: 22px;
        margin: 0 auto;
        background: #dfe4ea;
        box-shadow: inset 0 -1px #c3c9d2;
        overflow: hidden;
        user-select: none;
      }
      .doc-ruler[hidden] { display: none; }
      .doc-ruler .ruler-area { position: absolute; top: 0; bottom: 0; background: #f7f9fc; }
      .doc-ruler .ruler-tick { position: absolute; bottom: 0; width: 1px; height: 4px; background: #8d96a3; }
      .doc-ruler .ruler-tick.major { height: 7px; background: #525b68; }
      .doc-ruler .ruler-tick b { position: absolute; left: 2px; bottom: 6px; font: 400 9px/1 var(--font-ui, sans-serif); color: #3a404a; }
      .doc-ruler .ruler-ind { position: absolute; width: 0; height: 0; margin-left: -5px; border: 5px solid transparent; cursor: ew-resize; touch-action: none; }
      .doc-ruler .ruler-ind.first { top: 0; border-top: 6px solid #2f7de1; border-bottom: 0; }
      .doc-ruler .ruler-ind.left { bottom: 0; border-bottom: 6px solid #2f7de1; border-top: 0; }
      .doc-ruler .ruler-ind.right { bottom: 0; border-bottom: 6px solid #2f7de1; border-top: 0; }
      .doc-ruler .ruler-tab { position: absolute; bottom: 0; width: 7px; height: 6px; }
      .doc-ruler .ruler-tab.val-l { border-left: 1px solid #2f7de1; border-bottom: 1px solid #2f7de1; }
      .doc-ruler .ruler-tab.val-r { margin-left: -6px; border-right: 1px solid #2f7de1; border-bottom: 1px solid #2f7de1; }
      .doc-ruler .ruler-tab.val-c { width: 9px; margin-left: -4px; border-left: 1px solid #2f7de1; border-right: 1px solid #2f7de1; border-bottom: 1px solid #2f7de1; }
      .doc-ruler .ruler-unit { position: absolute; right: 3px; top: 3px; font: 400 9px/1 var(--font-ui, sans-serif); color: #6b7482; }

      /* ---- word ---- */
      .page {
        background: #fff;
        width: var(--page-w, 794px);
        margin: 26px auto 60px;
        /* 上内边距 = 节说的上边距 + 页眉带越过边距线的那一截（`applyBandYield` 量回来写的，#157：真机上
           带子贴在纸内、正文从它下沿起排）。带子不占高时那一句是 0px，摆位与没带子的件都照旧。 */
        padding: calc(var(--pad-t, 96px) + var(--band-yield-t, 0px)) var(--pad-r, 96px)
          calc(var(--pad-b, 96px) + var(--band-yield-b, 0px)) var(--pad-l, 96px);
        min-height: 1000px;
        box-shadow: 0 2px 18px #0002;
        font-family: var(--font-doc);
        font-size: 12pt;
        line-height: 1.62;
        color: #14161a;
      }
      /* An empty paragraph holds a whole line, not one em of it: `1lh` is the line height the file asked for, so
         a blank line on a 312 缇 grid is 20.8px tall like the line under it rather than the stylesheet's 16px.
         No paragraph margin: on the authorized 46 份 a file's own statement of a vertical gap is rare — of its 7,455
         `w:pPr` blocks only 78 state 段前 and 244 state 段后 (`.scratch/corpus-recheck2.mjs`), so the overwhelming
         majority say nothing. Whether `w:pPrDefault` or `w:docDefaults` spells one on the authorized set is 待重证
         (the "0 of 201" reading came from the quarantined cohort), and so is the 117-of-201 named-style count — but
         the route is not in question: a style's space arrives from `render.ts` as an inline margin, the only route.
         The 8px this sheet used to add was the App's own: it made a 20.8px grid cell advance 28.8px and cut a page
         from 44 lines to 31 (`.scratch/para-gap-dom.ts`). */
      .page .para { margin: 0; min-height: 1lh; white-space: pre-wrap; }
      /* `w:fitText`（调整宽度）那一组要摊到文件说的宽度上：`--fit-char-ls` 是 run 自己那句 `w:spacing`，
         `--fit-ls` 是排版量出来摊给每个字的差（`doc-layout.ts` 的 `applyFitText`）。两句都不写进内联
         `letter-spacing`，因为编辑器把那一句读回 run 的 `w:spacing`——摊出来的字距不是文件说的话。 */
      .page [data-fit] { letter-spacing: calc(var(--fit-char-ls, 0px) + var(--fit-ls, 0px)); }
      .page[contenteditable="true"] { outline: none; }
      .page[contenteditable="true"] .bullet { user-select: none; }
      /* 格式刷举着的时候纸上是「可以刷」的手型指针（`DocEditor.copyFormat` 挂的这个类）：鼠标经过正文
         任何一处都该是这个指针，所以子元素也一起换——WPS 真机是不是这个光标未取证，这里只是别让它骗人。 */
      .page.fmt-painter, .page.fmt-painter * { cursor: copy; }
      /* A heading is a paragraph the *file* put a level on, not a paragraph the App restyles. Where the file's
         ladder answers, `render.ts` says so inline and an inline declaration wins; where it says nothing, the
         heading takes exactly what body text takes. This sheet used to answer instead: `h1` 19pt, `h2` 15.5pt,
         `h3` 13pt, all in the UI face at line-height 1.25, plus `.s-Title` 26pt/600 with a 4px gap and
         `.s-Subtitle` 14pt with an 18px one. Measured (`.scratch/title-css-dom.html`): a heading that states
         nothing drew a 32.66px line box over the 25.92px its neighbours draw — a quarter taller, and none of it
         asked for by the file. The audience is tiny either way — but that audience was counted on the quarantined
         cohort: 489 of its 13,426 root paragraphs are reached by those selectors, 486 of those carry their own size
         inline, and 0 are named `Title` or `Subtitle`, and the same three numbers are 待重证 on the authorized 46 份
         (`.scratch/title-css-audience.ts` over `/tmp/wps-grid201.txt`). What is not a corpus count is the shape:
         WPS signs 「标题 1」, and the class comes from `w:name`. What WPS itself draws for a heading whose style states nothing is
         未取证: the installed bundle ships no Writer template (`office6/templates` holds only two `.et` files), so
         there is nothing here to copy, and the App must not guess a line box.
         `font: inherit` is not a no-op: measured, an `h1` the sheet does not reach draws 32px/700 with a 21.44px
         gap over the 16px it inherits — the browser's own sheet is a second invention, larger than the first. And
         these three declarations are the only answer a heading gets from here: an `h1` placed on the paper without
         the `para` class, so `.page .para` cannot reach it, still draws 16px/400/25.92px and 0px of gap
         (`.scratch/title-css-dom.html`). */
      .page h1, .page h2, .page h3, .page h4 { font: inherit; line-height: inherit; margin: 0; }
      .page .doc-table { border-collapse: collapse; margin: 10px 0; width: auto; }
      /* 这一条原来写着 `border: 1px solid #b9bfc7`——给**每一枚**格子都画一条边。文件说过边的格子被行内 style
         盖住，没说过的那一格就归了这条 CSS：于是文件明说「这一条边不要线」（`w:val="none"`）的那些边也被画上
         一条，而且画在往纸上落的那份墨里（打印也带）。授权 46 份里量到 44 条这样的边（2 件，同一份模板的
         zh_CN/zh_HK 两份；`.scratch/gridlines-audience.py`）。边画不画只问文件，所以这条切掉。 */
      .page .doc-table td { padding: 5px 9px; vertical-align: top; }
      /* 「查看网格线」那一档（WPS：`CT_TableTools.kuip:8` 的 `ShowGridlines`）画的是**屏幕上的导引线**，不是
         文件里说的那一句：没人替这一条边说「画线」时，`render.ts` 把缺的那几条并成一整条 `--gl` 内阴影列表，
         画不画由容器上这枚 `doc-grid` 决定。用 box-shadow 不用 border，因为阴影不进盒模型——开与关之间纸上的
         行高与表宽一个像素都不动（`.scratch/tbl-grid-dom.ts` 逐条量两档的 rect）。清单只能整条给：`box-shadow`
         的列表里塞一枚 `none` 是非法值，整条声明一起作废。WPS 那一档默认开还是关**未取证**。 */
      #view.doc-grid { --gl-ink: #c3c9d4; }
      #view.doc-grid .page .doc-table td { box-shadow: var(--gl, none); }
      .page .bullet { display: inline-block; min-width: 22px; color: #4a5160; }
      .page .tab { display: inline-block; width: 32px; }
      /* 制表位前导符（`w:tab/@w:leader`，§17.3.2.27）。授权 46 份里 94 枚位说了前导符、枚枚 `dot`（正文 92 枚，
         `.scratch/tabs-leader-roundtrip.ts`）。这一句是**显示层**的：`doc-layout.ts` 把文件那个 token 挂在这一枚
         真正停进去的制表符的 `data-leader` 上，这里照着铺墨——**不往 span 里塞点字符**，因为编辑从纸面读回模型，
         好几条路把 `.tab` 当成恰好一枚标记来数（`doc-edit.ts:1697`/`:6077`/`:6122`），多进去的字面会把偏移、
         run 边界与修订范围一起带歪。
         墨挂在 `::after` 上并让它出流（宿主 `position: relative`，伪元素 `position: absolute`）：空的 inline-block
         本身 0 高，给它自己加高度会把行盒顶起来、把铺排改掉；出流的伪元素只碰墨、不碰尺寸（`.scratch/tab-leader-dom.ts`
         逐条量两档的 rect 与行数）。`spaces` 有意留白：文件说「空格」就是「没有线」。点距、粗细、这一条离基线多高
         全是自定——家里量不出 WPS 的点阵，它那一头画成什么样**未取证**。 */
      .page .tab[data-leader] { position: relative; }
      .page .tab[data-leader]::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background-repeat: repeat-x;
      }
      .page .tab[data-leader="dot"]::after {
        height: 2px;
        background-size: 4px 2px;
        background-image: radial-gradient(circle at 2px 1px, currentColor 0 0.75px, transparent 1px);
      }
      .page .tab[data-leader="middleDot"]::after {
        height: 6px;
        bottom: -1px;
        background-size: 5px 6px;
        background-image: radial-gradient(circle at 2.5px 3px, currentColor 0 1.1px, transparent 1.35px);
      }
      .page .tab[data-leader="dash"]::after {
        height: 1px;
        background-size: 6px 1px;
        background-image: linear-gradient(to right, currentColor 0 3px, transparent 3px 6px);
      }
      .page .tab[data-leader="line"]::after { height: 1px; background-color: currentColor; }
      .page .tab[data-leader="heavy"]::after { height: 2.5px; background-color: currentColor; }
      /* 显示/隐藏编辑标记（WPS `m_ShowHideEditMark` 的第一条子项「段落标记」，`CT_Home.kuip:337` 挂在段落组）。
         它挂在工作台上，`w:p` 没有「显示段落标记」这一位——所以这一档不改字节、不进撤销栈、不参与「件改了没有」。
         墨挂在 `::after` 上且**零宽**（`inline-block; width:0; overflow:visible`）：字面落在最后一行文字之后，
         却不占一个字的宽度——开与关之间行盒、表宽、页数与每一块的 rect 都不动（装机烟测 `editMarksLeg` 逐条量）。
         字号与行高不另说，跟着段落自己那份（段落的格式只有文件一个主人，`tests/doc-line-spacing.test.ts` 里那条
         护栏就是量这一句的）；墨色是屏幕标记，不是文件里的字色。
         `w:tab` 的箭头与空格点**没画**：`.tab` 那枚 `::after` 已经归前导符（`data-leader`），一枚伪元素说不了
         两件事；WPS 画成什么样也**未取证**。第二条、第三条子项（段落布局、小十字）同样未取证，不摆。 */
      #view.edit-marks .page .para::after {
        content: "¶";
        display: inline-block;
        width: 0;
        overflow: visible;
        color: #b03a2e;
        vertical-align: baseline;
        pointer-events: none;
        user-select: none;
      }
      .page a { color: #2b62a8; }

      /* ---- header / footer areas ---- */
      .hf {
        width: var(--page-w, 794px);
        margin: 0 auto;
        padding: 18px 96px 6px;
        font-family: var(--font-doc);
        font-size: 9.5pt;
        color: #565d68;
        outline: none;
        cursor: pointer;
        min-height: 14px;
      }
      .hf-bottom { padding: 6px 96px 18px; }
      .hf[contenteditable="true"] { background: #fbfcfe; box-shadow: 0 0 0 1.5px var(--accent-soft); cursor: text; }
      .hf-p { min-height: 1em; white-space: pre-wrap; line-height: 1.4; }

      /* ---- slides ---- */
      .deck { display: flex; height: 100%; }
      .rail { width: 168px; flex: none; overflow: auto; background: #e6e9ed; border-right: 1px solid #cfd4da; padding: 10px 0; }
      .rail-bar { display: flex; gap: 4px; justify-content: center; margin-bottom: 8px; }
      .rail-bar button { width: 30px; height: 24px; border: 1px solid #c3c9d2; background: #fff; border-radius: 5px; cursor: pointer; font-size: 12px; line-height: 1; color: #333a45; }
      .rail-bar button:hover { border-color: var(--accent); color: var(--accent); }
      .thumb { position: relative; margin: 0 auto 10px; border: 1px solid #c3c9d2; background: #fff; cursor: pointer; overflow: hidden; }
      .thumb.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
      .thumb span { position: absolute; left: 3px; top: 1px; font-size: 10px; color: #6b7280; }
      .stage { flex: 1; display: flex; align-items: center; justify-content: center; background: #d9dde2; overflow: auto; }
      /* 舞台框 = 缩放后的那张纸；标尺占掉上/左各 16 px，跟着纸边走而不是跟着舞台边。 */
      .stage-frame { position: relative; flex: none; }
      .scaler { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: 0 6px 28px #0003; background: #fff; }
      .stage.ruled .scaler { left: 16px; top: 16px; }
      /* 标尺刻度由 deck-edit 按屏幕像素摆（数字不随纸缩，位置随），与 Writer 那条标尺同一副长相。 */
      .stage-ruler { position: absolute; z-index: 2; pointer-events: none; background-color: #f4f6f8; overflow: hidden; }
      .stage-ruler.h { left: 16px; right: 0; top: 0; height: 15px; border-bottom: 1px solid #c3c9d2; }
      .stage-ruler.v { top: 16px; bottom: 0; left: 0; width: 15px; border-right: 1px solid #c3c9d2; }
      .stage-ruler .tick { position: absolute; background: #8d96a3; }
      .stage-ruler.h .tick { bottom: 0; width: 1px; height: 4px; }
      .stage-ruler.h .tick.major { height: 6px; background: #525b68; }
      .stage-ruler.h b { position: absolute; top: 0; transform: translateX(2px); font: 400 8px/10px var(--font-ui, sans-serif); color: #3a404a; }
      .stage-ruler.v .tick { right: 0; height: 1px; width: 4px; }
      .stage-ruler.v .tick.major { width: 6px; background: #525b68; }
      .stage-ruler.v b { position: absolute; left: 0; transform: translateY(1px); font: 400 7px/7px var(--font-ui, sans-serif); color: #3a404a; }
      /* 查看网格线：纸上导引线，间距取自件里的 p:gridSpacing，不上纸也不接指针。 */
      .sdeck-grid { position: absolute; inset: 0; pointer-events: none; background-image: repeating-linear-gradient(90deg, #3341551f 0 1px, transparent 1px var(--grid-pitch)), repeating-linear-gradient(180deg, #3341551f 0 1px, transparent 1px var(--grid-pitch)); }
      .slide { position: relative; overflow: hidden; font-family: var(--font-ui); color: #14161a; }
      .shape { position: absolute; }
      /* An empty layout placeholder's prompt. WPS's own prompt box metrics are not measured yet. */
      .ph-hint { display: flex; align-items: center; justify-content: center; box-sizing: border-box; border: 1px dashed #b9c0c8; color: #8a929b; font-size: 16px; pointer-events: none; user-select: none; }
      /* WPS turns a prompt into its placeholder on the click, so the stage one is live. */
      .stage .ph-hint { pointer-events: auto; cursor: text; }
      .stage .ph-hint:focus-visible { outline: 2px solid #2b6cb0; outline-offset: 1px; }
      .shape-text { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
      .shape-text[contenteditable="true"] { cursor: text; }
      .sp-p { font-size: 14px; line-height: 1.3; }
      .st-table table { border-collapse: collapse; width: 100%; height: 100%; }
      .st-table td { border: 1px solid #b9bfc7; padding: 3px 6px; font-size: 13px; }
      .st-table td[contenteditable="true"] { outline: 1.5px solid var(--accent); background: #fff; }
      .sel-box { position: absolute; outline: 1.5px solid var(--accent); pointer-events: none; }
      .sel-box i { position: absolute; pointer-events: auto; background: #fff; border: 1px solid var(--accent); border-radius: 2px; }
      .sel-box i[data-dir="nw"], .sel-box i[data-dir="se"] { cursor: nwse-resize; }
      .sel-box i[data-dir="ne"], .sel-box i[data-dir="sw"] { cursor: nesw-resize; }
      .sel-box i[data-dir="n"], .sel-box i[data-dir="s"] { cursor: ns-resize; }
      .sel-box i[data-dir="e"], .sel-box i[data-dir="w"] { cursor: ew-resize; }
      .sel-box i[data-dir="rot"] { cursor: grab; border-radius: 50%; background: var(--accent); }

      /* ---- spreadsheet extras ---- */
      .fill-box { position: absolute; width: 8px; height: 8px; background: var(--accent); border: 1px solid #fff; cursor: crosshair; z-index: 6; display: none; }
      .grip { position: absolute; z-index: 7; }
      .grip-col { width: 6px; cursor: col-resize; }
      .grip-row { height: 6px; cursor: row-resize; }
      .sheet-pics { position: absolute; inset: 22px 0 0 46px; pointer-events: none; }
      .sheet-pic { position: absolute; pointer-events: auto; }
      td.has-note { position: relative; }
      td.has-note::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 6px 6px 0; border-color: transparent #d6604d transparent transparent; }
      .sheet-chart { position: absolute; pointer-events: auto; }
      .sheet-chart svg { display: block; }
      .sheet-chart { cursor: move; user-select: none; touch-action: none; }
      .sheet-chart svg { width: 100%; height: 100%; }
      .chart-resize { display: none; position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px; border: 1px solid #fff; background: #158b72; cursor: nwse-resize; }
      .chart-selected .chart-resize { display: block; }
      .sheet-chart.chart-selected { outline: 2px solid #158b72; outline-offset: 2px; }
      .chart-editor { width: 548px; max-width: calc(100vw - 32px); border: 1px solid #d4d9de; border-radius: 12px; padding: 22px; color: #303940; box-shadow: 0 16px 60px #0003; }
      .chart-editor::backdrop { background: #132b3f45; }
      .chart-editor header, .chart-editor footer { display: flex; align-items: center; gap: 10px; }
      .chart-editor h2 { font-size: 18px; margin: 0 0 16px; flex: 1; }
      .chart-editor button { border: 1px solid #d4d9de; background: #fff; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
      .chart-editor .chart-close { border: 0; font-size: 20px; padding: 0 4px; align-self: flex-start; }
      .chart-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .chart-fields label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
      .chart-fields label:first-child, .chart-source { grid-column: 1 / -1; }
      .chart-fields input:not([type=checkbox]), .chart-fields select { min-width: 0; padding: 8px; border: 1px solid #d4d9de; border-radius: 5px; font: inherit; background: #fff; }
      .chart-fields small { line-height: 1.5; color: #72808a; }
      .chart-fields .chart-legend { flex-direction: row; align-items: center; }
      .chart-preview { margin-top: 14px; overflow: auto; }
      .chart-error { min-height: 18px; color: #ac392e; font-size: 12px; margin: 8px 0; }
      .chart-editor footer span { flex: 1; }
      .chart-editor .chart-delete { color: #ac392e; border-color: transparent; }
      .chart-editor .chart-apply { background: #158b72; color: #fff; border-color: #158b72; }
      .chart-editor .chart-apply:disabled { opacity: .4; cursor: default; }

      /* ---- insert table picker ---- */
      .gridpick { display: grid; grid-template-columns: repeat(10, 16px); gap: 2px; padding: 10px; }
      .gridpick button { width: 16px; height: 13px; border: 1px solid #c3c9d2; background: #fff; border-radius: 2px; padding: 0; }
      .gridpick button.hot { background: var(--accent-soft); border-color: var(--accent); }
      .gridpick-info { grid-column: 1 / -1; font-size: 11.5px; color: #5b636d; text-align: center; padding-top: 4px; }
      .notes { flex: none; max-height: 120px; overflow: auto; background: #f0f2f5; border-top: 1px solid #cfd4da; padding: 10px 16px; font-size: 12.5px; color: #4a5160; }
      .notes-text { margin-top: 3px; outline: none; white-space: pre-wrap; }
      .notes-text[data-empty="1"]::before { content: "点击添加备注…"; color: #98a0ac; }

      /* ---- slide sorter / notes page ---- */
      /* 幻灯片浏览：整副幻灯片按文件里的顺序铺成网格。 */
      .deck.sorter { display: block; height: 100%; overflow: auto; background: #d9dde2; padding: 22px 26px 30px; }
      .sorter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 22px 26px; justify-items: center; align-items: start; }
      .sorter-cell { position: relative; padding: 17px 6px 6px; border: 2px solid transparent; border-radius: 4px; cursor: pointer; }
      .sorter-cell.on { border-color: var(--accent); background: #ffffff80; }
      .sorter-num { position: absolute; left: 4px; top: 1px; font-size: 11px; color: #5c6572; }
      .sorter-slide { overflow: hidden; background: #fff; border: 1px solid #c3c9d2; box-shadow: 0 2px 8px #0002; }
      .sorter-cell.on .sorter-slide { border-color: var(--accent); }

      /* 备注页：一张纸上先幻灯片后备注，备注可改，写回的还是那一条 notes。 */
      .deck.notes-page { display: block; height: 100%; overflow: auto; background: #d9dde2; padding: 26px 0 40px; }
      .notes-sheet { width: min(720px, calc(100% - 56px)); margin: 0 auto; background: #fff; border: 1px solid #c3c9d2; box-shadow: 0 4px 18px #0002; padding: 26px 40px 40px; }
      .notes-slide { margin: 0 auto; overflow: hidden; border: 1px solid #b9bfc7; }
      .notes-sheet-text { margin-top: 26px; min-height: 150px; outline: none; white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: #2c3138; }
      .notes-sheet-text[data-empty="1"]::before { content: attr(data-placeholder); color: #98a0ac; }

      /* 阅读视图：满窗一张幻灯片压一条翻页条，功能区还在，不接管全屏。 */
      .deck.reading { display: flex; flex-direction: column; height: 100%; background: #3b3f45; }
      .reading-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .reading-slide { flex: none; background: #fff; box-shadow: 0 6px 40px #0006; transform-origin: center center; }
      .reading-bar { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; height: 42px; background: #2b2f35; color: #d8dce2; font-size: 12.5px; }
      .reading-btn { height: 26px; padding: 0 12px; border: 1px solid #4a5058; border-radius: 4px; background: #383d44; color: #e8eaed; font: inherit; cursor: pointer; }
      .reading-btn:hover:not(:disabled) { border-color: #6f7883; background: #434952; }
      .reading-btn:disabled { opacity: .4; cursor: default; }
      .reading-count { min-width: 58px; text-align: center; letter-spacing: .06em; }
      .reading-exit { margin-left: 14px; }

      /* ---- slideshow ---- */
      .show {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .show.idle { cursor: none; }
      .show.black .show-slide, .show.black .show-count { visibility: hidden; }
      .show-slide { flex: none; transform-origin: center center; animation: show-in .16s ease-out; }
      @keyframes show-in { from { opacity: 0; } to { opacity: 1; } }
      .show-count {
        position: fixed;
        right: 20px;
        bottom: 16px;
        font-size: 13px;
        letter-spacing: .05em;
        color: #b9bfc7;
        opacity: .9;
        transition: opacity .6s;
      }
      .show.idle .show-count { opacity: 0; }

      .doc-tab { font-size: 12px; color: var(--ink-dim); padding: 3px 10px; border-radius: 6px; background: #2c313a; border: 1px solid #3a404a; }
      #file-input { display: none; }

      @media print {
        header, .ribbon, .bar, .sheetbar { display: none !important; }
        /* 标尺是工作台上的尺，跟前头的工具栏一样上不了纸。 */
        .doc-ruler { display: none !important; }
        body { background: #fff; }
        main { display: block; overflow: visible !important; }
        #view { overflow: visible !important; }
        .page { box-shadow: none; margin: 0 auto; }
        /* 导引线上不了纸：那一档只是屏幕上看格子的地界，文件里没这一句。开着那一档打印时也得一条不画。 */
        #view .page .doc-table td { box-shadow: none !important; }
        .deck { height: auto; }
        .rail, .notes { display: none; }
        .stage { overflow: visible; background: #fff; }
      }
      .filter-header { position: relative; padding-right: 22px !important; }
      .filter-arrow { position: absolute; right: 1px; top: 1px; bottom: 1px; width: 19px; padding: 0; border: 1px solid #c6ccd3; background: #f6f8fa; color: #526172; font-size: 11px; cursor: pointer; }
      .filter-arrow.filter-active { color: #087f8c; background: #d8f1f2; border-color: #087f8c; }
      .filter-editor { width: 370px; max-height: 85vh; padding: 20px; border: 1px solid #c6ccd3; border-radius: 12px; box-shadow: 0 18px 60px #0003; user-select: text; color: #243345; }
      .filter-editor::backdrop { background: #16202d55; }
      .filter-editor header,.filter-editor footer,.filter-sort,.filter-check-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      .filter-editor header strong { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      .filter-editor button,.filter-editor select,.filter-editor input:not([type=checkbox]) { border: 1px solid #c6ccd3; border-radius: 5px; padding: 6px 9px; background: white; font: inherit; }
      .filter-editor button { cursor: pointer; }
      .filter-editor button:disabled { opacity: .5; cursor: default; }
      .filter-editor label { display: flex; align-items: center; gap: 7px; margin: 8px 0; }
      .filter-editor [name=filter-search] { width: 100%; box-sizing: border-box; margin: 12px 0 8px; }
      .filter-options { max-height: 240px; overflow: auto; padding: 4px 8px; border: 1px solid #e1e6eb; border-radius: 6px; }
      .filter-options label[hidden] { display: none; }
      .filter-options span { white-space: pre-wrap; overflow-wrap: anywhere; }
      .filter-custom input:not([type=checkbox]) { min-width: 0; width: 135px; }
      .filter-custom small { color: #667485; }
      .filter-error { color: #ad3528; font-size: 12px; min-height: 16px; }
      .filter-editor footer { margin-bottom: 0; flex-wrap: wrap; }
      .filter-editor .filter-apply { color: white; background: #087f8c; border-color: #087f8c; }
    </style>
  </head>
  <body>
    <header>
      <div class="qat" id="qat">
        <button class="tool" id="open-btn" title="打开 (⌘O)" aria-label="打开">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
        </button>
        <button class="tool" id="save-btn" disabled title="保存 (⌘S)" aria-label="保存">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3"/><path d="M8 14h8v7H8z"/></svg>
        </button>
        <button class="tool" id="pdf-btn" title="导出 PDF" aria-label="导出 PDF">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6M9.5 14.5 12 17l2.5-2.5"/></svg>
        </button>
        <span class="qat-sep" aria-hidden="true"></span>
        <button class="tool" id="undo-btn" title="撤销 (⌘Z)" aria-label="撤销">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H9"/></svg>
        </button>
        <button class="tool" id="redo-btn" title="重做 (⇧⌘Z)" aria-label="重做">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H15"/></svg>
        </button>
      </div>
      <div class="title-slot" id="title">没有打开的文档</div>
    </header>

    <div class="ribbon" id="ribbon"></div>

    <div class="bar" id="bar">
      <div class="addr" id="addr">A1</div>
      <div class="fx">fx</div>
      <input id="input" spellcheck="false" placeholder="输入数值、文本或 =SUM(A1:A9)" />
    </div>

    <main><div id="view"></div></main>
    <div class="sheetbar" id="sheetbar" style="display:none"></div>
    <input type="file" id="file-input" accept=".xlsx,.xlsm,.docx,.dotx,.pptx,.potx,.zip" />

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
